name: Sync Upstream Main

on:
  schedule:
    - cron: '0 4 * * *' # Executa diariamente às 04:00 UTC
  workflow_dispatch: # Permite disparo manual na aba Actions

permissions:
  contents: write

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/mendableai/firecrawl.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "chore: merge upstream main"
          git push origin main
